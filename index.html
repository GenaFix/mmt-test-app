<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кинезио Трекер (v8 - Ultra Fast)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #007bff;
            --calib-color: #ff9f43;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden; 
        }
        .controls {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #connectBtn { background-color: var(--accent-color); }
        #connectBtn:active { background-color: #0056b3; }
        
        #calibrateBtn { background-color: var(--calib-color); color: #000; }
        #calibrateBtn:active { background-color: #cc7a2b; }

        .slider-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 5px;
        }
        input[type=range] {
            flex-grow: 1;
            margin: 0 15px;
        }
        .chart-container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 250px;
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
            flex-grow: 1;
        }
        .status { font-size: 14px; color: #aaaaaa; text-align: center; margin-bottom: 5px; }
        .chart-title { font-size: 14px; color: #888; text-align: center; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;}
    </style>
</head>
<body>

    <div class="controls">
        <button id="connectBtn">Подключить BLE</button>
        <div id="status" class="status">Статус: Отключено</div>
        
        <button id="calibrateBtn">Обнулить (Калибровка 0)</button>
        
        <div class="slider-container">
            <span>Чувств.</span>
            <input type="range" id="sensitivitySlider" min="1" max="50" step="1" value="15">
            <span id="sensValue">15x</span>
        </div>
    </div>

    <div class="chart-container">
        <div class="chart-title">Гипертонус (Вверх) / Гипотонус (Вниз)</div>
        <canvas id="forceChart"></canvas>
    </div>

    <script>
        const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const TX_CHAR_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

        let forceChart;
        const maxDataPoints = 120; // Длина хвоста графика

        let rawFSR = 0;
        let offsetFSR = 0;
        let sensitivity = 15; 

        function initChart() {
            const forceCtx = document.getElementById('forceChart').getContext('2d');
            forceChart = new Chart(forceCtx, {
                type: 'line',
                data: {
                    labels: Array(maxDataPoints).fill(''),
                    datasets: [{
                        label: 'Сила',
                        data: Array(maxDataPoints).fill(0),
                        borderColor: '#2ed573',
                        borderWidth: 3, 
                        pointRadius: 0,
                        tension: 0, // 0 = абсолютная резкость, никаких сглаживаний углов
                        fill: false
                    }]
                },
                options: {
                    animation: false, // Отключаем анимации для мгновенного отклика
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'none' },
                    scales: {
                        x: { display: false },
                        y: { 
                            min: -200, 
                            max: 200,  
                            ticks: { stepSize: 50, color: '#888' },
                            grid: {
                                // Делаем нулевую ось белой и полупрозрачной (как координатную сетку)
                                color: (context) => {
                                    if (context.tick.value === 0) return 'rgba(255, 255, 255, 0.4)';
                                    return '#333'; 
                                },
                                lineWidth: (context) => {
                                    if (context.tick.value === 0) return 2;
                                    return 1;
                                }
                            }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // Кнопка калибровки
        document.getElementById('calibrateBtn').addEventListener('click', () => {
            offsetFSR = rawFSR; // Запоминаем текущее давление как НОЛЬ
            forceChart.data.datasets[0].data = Array(maxDataPoints).fill(0); // Стираем историю
        });

        // Ползунок
        document.getElementById('sensitivitySlider').addEventListener('input', (e) => {
            sensitivity = parseFloat(e.target.value);
            document.getElementById('sensValue').innerText = sensitivity + 'x';
        });

        // -----------------------------------------------------
        // ИГРОВОЙ ДВИЖОК ОТРИСОВКИ (40 Кадров в секунду)
        // График обновляется независимо от Bluetooth, что убирает лаги
        // -----------------------------------------------------
        setInterval(() => {
            if (forceChart) {
                forceChart.update('none');
            }
        }, 25); // 25 мс = 40 раз в секунду

        // -----------------------------------------------------
        // BLUETOOTH ЛОГИКА (Только принимает данные, НЕ рисует)
        // -----------------------------------------------------
        let dataBuffer = '';

        async function connectBLE() {
            try {
                document.getElementById('status').innerText = 'Поиск...';
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Holyiot' }],
                    optionalServices: [SERVICE_UUID]
                });

                device.addEventListener('gattserverdisconnected', () => {
                    document.getElementById('status').innerText = 'Отключено';
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(TX_CHAR_UUID);

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);

                document.getElementById('status').innerText = 'Подключено. Ждем данные...';
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = 'Ошибка: ' + error.message;
            }
        }

        function handleData(event) {
            const value = event.target.value;
            const decoder = new TextDecoder('utf-8');
            dataBuffer += decoder.decode(value);

            let lines = dataBuffer.split('\n');
            dataBuffer = lines.pop(); 

            lines.forEach(line => {
                let parts = line.trim().split(',');
                if (parts.length > 0) {
                    let f = parseFloat(parts[0]);
                    
                    if (!isNaN(f)) {
                        rawFSR = f; // Получили сырое значение
                        
                        // Считаем масштаб на лету
                        let displayFSR = (rawFSR - offsetFSR) * sensitivity;

                        // Ограничитель (чтобы график не улетал в бесконечность и не вешал Safari)
                        if (displayFSR > 220) displayFSR = 220;
                        if (displayFSR < -220) displayFSR = -220;

                        // Пушим в память графика (без команды на перерисовку!)
                        let forceData = forceChart.data.datasets[0].data;
                        forceData.push(displayFSR);
                        forceData.shift();
                    }
                }
            });
        }

        document.getElementById('connectBtn').addEventListener('click', connectBLE);
        initChart();
    </script>
</body>
</html>
