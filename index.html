<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кинезио Трекер ММТ (v5 - PRO)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #007bff;
            --calib-color: #ff9f43;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh; /* Занимаем всю высоту экрана */
            box-sizing: border-box;
        }
        .controls {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            box-sizing: border-box;
            flex-shrink: 0; /* Панель управления не сжимается */
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #connectBtn { background-color: var(--accent-color); }
        #connectBtn:active { background-color: #0056b3; }
        
        #calibrateBtn { background-color: var(--calib-color); color: #000; }
        #calibrateBtn:active { background-color: #cc7a2b; }

        .slider-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 5px;
        }
        input[type=range] {
            flex-grow: 1;
            margin: 0 15px;
        }
        .chart-container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            flex-grow: 1; /* График занимает всё оставшееся место */
            display: flex;
            flex-direction: column;
            position: relative;
        }
        canvas {
            flex-grow: 1;
        }
        .status { font-size: 14px; color: #aaaaaa; text-align: center; margin-bottom: 5px; }
        .chart-title { font-size: 14px; color: #888; text-align: center; margin-bottom: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;}
    </style>
</head>
<body>

    <div class="controls">
        <button id="connectBtn">Подключить BLE</button>
        <div id="status" class="status">Статус: Отключено</div>
        
        <button id="calibrateBtn">Обнулить график</button>
        
        <div class="slider-container">
            <span>Чувств.</span>
            <input type="range" id="sensitivitySlider" min="1" max="50" step="1" value="15">
            <span id="sensValue">15x</span>
        </div>
    </div>

    <!-- График силы на весь экран -->
    <div class="chart-container">
        <div class="chart-title">Давление мышцы (Гипотонус < 0)</div>
        <canvas id="forceChart"></canvas>
    </div>

    <script>
        const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const TX_CHAR_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

        let forceChart;
        const maxDataPoints = 120; // Чуть увеличил хвост истории

        let rawFSR = 0;
        let offsetFSR = 0;
        let sensitivity = 15; 

        // Массив для программного сглаживания (Moving Average)
        let fsrHistory = [];
        const smoothingWindow = 5; 

        function initChart() {
            const forceCtx = document.getElementById('forceChart').getContext('2d');
            forceChart = new Chart(forceCtx, {
                type: 'line',
                data: {
                    labels: Array(maxDataPoints).fill(''),
                    datasets: [{
                        label: 'Сила',
                        data: Array(maxDataPoints).fill(0),
                        borderColor: '#2ed573',
                        backgroundColor: 'rgba(46, 213, 115, 0.1)',
                        borderWidth: 3,
                        pointRadius: 0,
                        tension: 0.2, // Делает линию более плавной
                        fill: true
                    }]
                },
                options: {
                    animation: false,
                    responsive: true,
                    maintainAspectRatio: false, // Позволяет графику тянуться на весь экран
                    interaction: { mode: 'none' }, // Отключаем лишние расчеты наведений
                    scales: {
                        x: { display: false },
                        y: { min: -150, max: 150, grid: {color: '#333', zeroLineColor: '#fff'} }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function updateDashboard() {
            // Сглаживание данных (убираем "пилу")
            fsrHistory.push(rawFSR);
            if (fsrHistory.length > smoothingWindow) {
                fsrHistory.shift();
            }
            let smoothedFSR = fsrHistory.reduce((a, b) => a + b, 0) / fsrHistory.length;

            // Применяем калибровку и чувствительность
            let displayFSR = (smoothedFSR - offsetFSR) * sensitivity;

            let forceData = forceChart.data.datasets[0].data;
            forceData.push(displayFSR);
            forceData.shift();
            
            // Оптимизированное обновление
            forceChart.update('none'); 
        }
        
        document.getElementById('calibrateBtn').addEventListener('click', () => {
            offsetFSR = rawFSR;
            forceChart.data.datasets[0].data = Array(maxDataPoints).fill(0);
            forceChart.update('none');
        });

        document.getElementById('sensitivitySlider').addEventListener('input', (e) => {
            sensitivity = parseFloat(e.target.value);
            document.getElementById('sensValue').innerText = sensitivity + 'x';
        });

        let dataBuffer = '';

        async function connectBLE() {
            try {
                document.getElementById('status').innerText = 'Поиск...';
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Holyiot' }],
                    optionalServices: [SERVICE_UUID]
                });

                device.addEventListener('gattserverdisconnected', () => {
                    document.getElementById('status').innerText = 'Отключено';
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(TX_CHAR_UUID);

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);

                document.getElementById('status').innerText = 'Подключено. Ждем данные...';
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = 'Ошибка: ' + error.message;
            }
        }

        function handleData(event) {
            const value = event.target.value;
            const decoder = new TextDecoder('utf-8');
            dataBuffer += decoder.decode(value);

            let lines = dataBuffer.split('\n');
            dataBuffer = lines.pop(); 

            lines.forEach(line => {
                let parts = line.trim().split(',');
                // Берем только первое значение (FSR), игнорируя остальное
                if (parts.length > 0) {
                    let f = parseFloat(parts[0]);
                    
                    if (!isNaN(f)) {
                        rawFSR = f;
                        updateDashboard();
                    }
                }
            });
        }

        document.getElementById('connectBtn').addEventListener('click', connectBLE);
        initChart();
    </script>
</body>
</html>
