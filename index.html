<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MMT Tracker (v9 - Kinesio Pro)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #007bff;
            --calib-color: #ff9f43;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden; 
        }
        .controls {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #connectBtn { background-color: var(--accent-color); }
        #connectBtn:active { background-color: #0056b3; }
        
        #calibrateBtn { background-color: var(--calib-color); color: #000; }
        #calibrateBtn:active { background-color: #cc7a2b; }

        .slider-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 5px;
        }
        input[type=range] {
            flex-grow: 1;
            margin: 0 15px;
        }
        .chart-container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 250px;
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
            flex-grow: 1;
        }
        .status { font-size: 14px; color: #aaaaaa; text-align: center; margin-bottom: 5px; }
        .chart-title { font-size: 14px; color: #888; text-align: center; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;}
    </style>
</head>
<body>

    <div class="controls">
        <button id="connectBtn">Подключить BLE</button>
        <div id="status" class="status">Статус: Отключено</div>
        
        <button id="calibrateBtn">КАЛИБРОВКА НУЛЯ (PRE-TENSION)</button>
        
        <div class="slider-container">
            <span>Чувств.</span>
            <input type="range" id="sensitivitySlider" min="1" max="50" step="1" value="10">
            <span id="sensValue">10x</span>
        </div>
    </div>

    <div class="chart-container">
        <div class="chart-title">Нормотонус (Зеленый) / Гипотонус (Красный)</div>
        <canvas id="forceChart"></canvas>
    </div>

    <script>
        const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const TX_CHAR_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

        let forceChart;
        const maxDataPoints = 120; // Около 4 секунд истории

        // Переменные для математики
        let rawFSR = 0;
        let smoothedFSR = 0;
        let offsetFSR = 0;
        let currentDisplayFSR = 0; 
        
        let sensitivity = 10; 
        const emaAlpha = 0.4; // Коэффициент сглаживания (1 - без сглаживания, 0.1 - сильное)

        function initChart() {
            const forceCtx = document.getElementById('forceChart').getContext('2d');
            forceChart = new Chart(forceCtx, {
                type: 'line',
                data: {
                    labels: Array(maxDataPoints).fill(''),
                    datasets: [{
                        label: 'Давление',
                        data: Array(maxDataPoints).fill(0),
                        borderWidth: 3, 
                        pointRadius: 0,
                        tension: 0.2, // Плавные изгибы
                        fill: false,
                        // УМНАЯ РАСКРАСКА: Все что ниже нуля - красное, выше - зеленое
                        segment: {
                            borderColor: ctx => ctx.p0.parsed.y < 0 ? '#ff4757' : '#2ed573'
                        }
                    }]
                },
                options: {
                    animation: false,
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'none' },
                    scales: {
                        x: { display: false },
                        y: { 
                            min: -200, 
                            max: 200,  
                            ticks: { stepSize: 50, color: '#555' },
                            grid: {
                                color: (context) => context.tick.value === 0 ? 'rgba(255, 255, 255, 0.5)' : '#333',
                                lineWidth: (context) => context.tick.value === 0 ? 2 : 1
                            }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // Кнопка калибровки
        document.getElementById('calibrateBtn').addEventListener('click', () => {
            offsetFSR = smoothedFSR; // Точкой отсчета становится текущее сглаженное давление
            currentDisplayFSR = 0;
            forceChart.data.datasets[0].data = Array(maxDataPoints).fill(0);
        });

        document.getElementById('sensitivitySlider').addEventListener('input', (e) => {
            sensitivity = parseFloat(e.target.value);
            document.getElementById('sensValue').innerText = sensitivity + 'x';
        });

        // -----------------------------------------------------
        // НЕЗАВИСИМЫЙ ДВИЖОК ГРАФИКА (30 FPS)
        // Гарантирует плавное движение вне зависимости от скорости Bluetooth
        // -----------------------------------------------------
        setInterval(() => {
            if (forceChart) {
                let forceData = forceChart.data.datasets[0].data;
                forceData.push(currentDisplayFSR);
                forceData.shift();
                forceChart.update('none');
            }
        }, 33); // 33 мс = ~30 кадров в секунду

        // -----------------------------------------------------
        // ПРИЕМ И ОБРАБОТКА ДАННЫХ BLE
        // -----------------------------------------------------
        let dataBuffer = '';

        async function connectBLE() {
            try {
                document.getElementById('status').innerText = 'Поиск...';
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Holyiot' }],
                    optionalServices: [SERVICE_UUID]
                });

                device.addEventListener('gattserverdisconnected', () => {
                    document.getElementById('status').innerText = 'Отключено';
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(TX_CHAR_UUID);

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);

                document.getElementById('status').innerText = 'Подключено. Ждем данные...';
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = 'Ошибка: ' + error.message;
            }
        }

        function handleData(event) {
            const value = event.target.value;
            const decoder = new TextDecoder('utf-8');
            dataBuffer += decoder.decode(value);

            let lines = dataBuffer.split('\n');
            dataBuffer = lines.pop(); 

            lines.forEach(line => {
                let parts = line.trim().split(',');
                if (parts.length > 0) {
                    let f = parseFloat(parts[0]);
                    
                    if (!isNaN(f)) {
                        rawFSR = f; 
                        
                        // Экспоненциальное сглаживание (Убирает микротремор, оставляет суть)
                        smoothedFSR = (emaAlpha * rawFSR) + ((1 - emaAlpha) * smoothedFSR);

                        // Применяем калибровку и чувствительность
                        let calcFSR = (smoothedFSR - offsetFSR) * sensitivity;

                        // Ограничитель
                        if (calcFSR > 220) calcFSR = 220;
                        if (calcFSR < -220) calcFSR = -220;
                        
                        // Передаем значение в движок отрисовки
                        currentDisplayFSR = calcFSR;
                    }
                }
            });
        }

        document.getElementById('connectBtn').addEventListener('click', connectBLE);
        initChart();
    </script>
</body>
</html>
